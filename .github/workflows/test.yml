name: tests

on:
  push:
  pull_request:

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the data files
        run: python -m unittest discover -s tests -v
      - name: The collector compiles
        run: python -m py_compile collect.py
